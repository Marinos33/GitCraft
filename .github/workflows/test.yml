name: Tests

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitcraft-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: Windows
          - runner: ubuntu-22.04
            platform: Linux
          - runner: macos-latest
            platform: macOS
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tests-${{ matrix.runner }}
      - name: Install frontend dependencies
        run: npm --prefix ui ci --ignore-scripts
      - name: Build and typecheck the frontend
        run: npm --prefix ui run build
      - name: Test the frontend
        run: npm --prefix ui test
      - name: Test release notes
        run: node --test scripts/changelog-release.test.mjs
      - name: Test browser protocol dispatch
        run: node --test scripts/cdp-messages.test.mjs
      - name: Test desktop harness path boundaries
        run: node --test scripts/desktop-harness-paths.test.mjs
      - name: Test native Git operations
        run: cargo test --locked -- --test-threads=1
      # cargo test regenerates the IPC types in ui/src/bindings from the Rust definitions.
      - name: Check that the generated IPC types are committed
        if: runner.os == 'Linux'
        shell: bash
        run: |
          stale=$(git status --porcelain -- ui/src/bindings)
          if [[ -n "$stale" ]]; then
            echo "::error::ui/src/bindings is out of date. Run cargo test and commit the changes:"
            echo "$stale"
            git diff -- ui/src/bindings
            exit 1
          fi

  browser:
    name: Headless browser regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: chrome
      - run: npm --prefix ui ci --ignore-scripts
      - name: Exercise components and resource budgets
        run: node scripts/verify-browser.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regressions
          path: target/verification/
          if-no-files-found: warn

  clippy:
    name: Rust lints (clippy)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: clippy
      # tauri::generate_context! needs the built front end; an empty dist is enough for linting.
      - name: Provide a placeholder front end
        run: mkdir -p ui/dist && echo "<!doctype html>" > ui/dist/index.html
      # Correctness lints fail the job (they are deny-by-default); every other lint is reported as a
      # warning so the existing backlog stays visible without blocking pull requests.
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D clippy::correctness
