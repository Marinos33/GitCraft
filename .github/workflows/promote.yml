name: Promote to stable

# Builds of main are published as pre-releases and offered on the beta channel. Run this workflow
# with one of those versions to make it the stable release that installed copies update to.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to promote, for example 0.1.42
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitcraft-release
  queue: max

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Promote the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Enter a version such as 0.1.42."
            exit 1
          fi
          tag="v$VERSION"
          release=$(gh release view "$tag" --json isDraft,isPrerelease,assets) || { echo "::error::Release $tag does not exist."; exit 1; }
          if [[ $(jq -r .isDraft <<<"$release") == true ]]; then
            echo "::error::Release $tag is still a draft; its build has not finished publishing."
            exit 1
          fi
          if ! jq -e '.assets[] | select(.name == "latest.json")' <<<"$release" >/dev/null; then
            echo "::error::Release $tag has no update manifest (latest.json)."
            exit 1
          fi
          stable=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          versions=$(printf '%s\n' "$stable" "$tag" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vu)
          if [[ $(tail -n 1 <<<"$versions") != "$tag" ]]; then
            echo "::error::A newer stable release is already published."
            exit 1
          fi

          # Notes for the stable release cover every change since the previous stable release.
          previous=$(awk -v target="$tag" '$0 == target { print prev; exit } { prev = $0 }' <<<"$versions")
          git show "refs/tags/$tag:CHANGELOG.md" > "$RUNNER_TEMP/current-changelog.md"
          baseline="$RUNNER_TEMP/previous-changelog.md"
          : > "$baseline"
          if [[ -n "$previous" ]] && git cat-file -e "refs/tags/$previous:CHANGELOG.md"; then
            git show "refs/tags/$previous:CHANGELOG.md" > "$baseline"
          fi
          node scripts/changelog-release.mjs notes "$RUNNER_TEMP/current-changelog.md" "$baseline" > release-notes.md
          if [[ -n "$previous" ]]; then
            printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous" "$tag" >> release-notes.md
          fi
          gh release edit "$tag" --prerelease=false --latest --notes-file release-notes.md
